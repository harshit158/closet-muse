[project]
name = "closet-muse"
version = "0.1.0"
description = "AI based fashion assistant to help you style your wardrobe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.4",
    "google-genai>=1.46.0",
    "ollama>=0.6.1",
    "pillow==11.3.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "streamlit==1.50.0",
    "streamlit-extras>=0.7.8",
    "streamlit-image-select>=0.6.0",
    "uvicorn>=0.38.0",
    "foundry @ git+https://github.com/harshit158/foundry.git@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closet_muse"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "openai>=3.42.0",
]
