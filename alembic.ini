# Alembic configuration.
#
# The database URL is intentionally NOT set here: ``migrations/env.py`` derives it
# from ``closet_muse.settings.sqlite_path`` so there is exactly one source of truth
# for where the SQLite file lives. Setting ``sqlalchemy.url`` here would let the two
# drift apart silently.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Timestamped filenames keep revisions ordered on disk the same way they are in the
# chain. ``%(rev)s`` is still the canonical id used by ``alembic upgrade``.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Placeholder. Left blank on purpose — see the note above.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
